<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tube-mp3 &middot; sign in</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #171a23;
      --border: #262b38;
      --text: #e6e8ee;
      --muted: #98a0b3;
      --accent: #6d8bff;
      --accent-press: #5875e8;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: #0d0f16;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      text-align: center;
    }
    input[type="password"]:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px 16px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-press); }
    .err { margin: 14px 0 0; color: var(--danger); font-size: 14px; }
    .lock { font-size: 30px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="lock">&#128274;</div>
    <h1>tube-mp3</h1>
    <p class="sub">Enter the password to continue.</p>
    <form method="post">
      <input type="password" name="password" placeholder="Password" autofocus required />
      <button type="submit">Enter</button>
      {% if error %}<p class="err">{{ error }}</p>{% endif %}
    </form>
  </div>
</body>
</html>
